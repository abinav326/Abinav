
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anamika B | Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* ===== CSS RESET & ROOT ===== */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6C63FF;
            --primary-dark: #5A52D5;
            --primary-light: #8B85FF;
            --accent: #00D4AA;
            --accent-dark: #00B894;
            --bg-dark: #0a0a0f;
            --bg-card: #12121a;
            --bg-card-hover: #1a1a2e;
            --bg-section-alt: #0d0d14;
            --text-primary: #EAEAEA;
            --text-secondary: #A0A0B0;
            --text-muted: #6B6B80;
            --border-color: #2a2a3a;
            --gradient-1: linear-gradient(135deg, #6C63FF 0%, #00D4AA 100%);
            --gradient-2: linear-gradient(135deg, #6C63FF 0%, #E058A0 100%);
            --gradient-3: linear-gradient(135deg, #00D4AA 0%, #00B4D8 100%);
            --shadow-glow: 0 0 40px rgba(108, 99, 255, 0.15);
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.3);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: 80px;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            line-height: 1.7;
            overflow-x: hidden;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        /* ===== ANIMATED BACKGROUND ===== */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .bg-animation .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            animation: floatOrb 20s ease-in-out infinite;
        }

        .bg-animation .orb:nth-child(1) {
            width: 400px;
            height: 400px;
            background: var(--primary);
            top: -100px;
            right: -100px;
            animation-delay: 0s;
        }

        .bg-animation .orb:nth-child(2) {
            width: 300px;
            height: 300px;
            background: var(--accent);
            bottom: -50px;
            left: -50px;
            animation-delay: -7s;
        }

        .bg-animation .orb:nth-child(3) {
            width: 250px;
            height: 250px;
            background: #E058A0;
            top: 50%;
            left: 50%;
            animation-delay: -14s;
        }

        @keyframes floatOrb {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(100px, -50px) scale(1.1); }
            50% { transform: translate(-50px, 100px) scale(0.9); }
            75% { transform: translate(50px, 50px) scale(1.05); }
        }

        /* ===== NAVIGATION ===== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            padding: 15px 0;
            transition: var(--transition);
            backdrop-filter: blur(20px);
            background: rgba(10, 10, 15, 0.8);
            border-bottom: 1px solid transparent;
        }

        .navbar.scrolled {
            border-bottom-color: var(--border-color);
            padding: 10px 0;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 8px;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: var(--transition);
            position: relative;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--text-primary);
            background: rgba(108, 99, 255, 0.1);
        }

        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
            gap: 5px;
            padding: 5px;
        }

        .hamburger span {
            width: 25px;
            height: 2px;
            background: var(--text-primary);
            transition: var(--transition);
            border-radius: 2px;
        }

        .hamburger.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }
        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }
        .hamburger.active span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -5px);
        }

        /* ===== SECTION COMMON ===== */
        .section {
            padding: 100px 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-alt {
            background: var(--bg-section-alt);
        }

        .section-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .section-label {
            display: inline-block;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--accent);
            margin-bottom: 12px;
            font-family: 'JetBrains Mono', monospace;
        }

        .section-title {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1.2;
        }

        .section-title .highlight {
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .section-subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-top: 15px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        /* ===== HERO SECTION ===== */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 120px 30px 80px;
            position: relative;
        }

        .hero-content {
            max-width: 1200px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 80px;
            align-items: center;
        }

        .hero-text {
            animation: fadeInUp 1s ease-out;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(108, 99, 255, 0.1);
            border: 1px solid rgba(108, 99, 255, 0.3);
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 0.85rem;
            color: var(--primary-light);
            margin-bottom: 25px;
            font-weight: 500;
        }

        .hero-badge .dot {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.3); }
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: -2px;
            margin-bottom: 10px;
        }

        .hero h1 .greeting {
            display: block;
            font-size: 1.3rem;
            font-weight: 400;
            color: var(--text-secondary);
            letter-spacing: 0;
            margin-bottom: 8px;
        }

        .hero h1 .name-gradient {
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-role {
            font-size: 1.3rem;
            color: var(--text-secondary);
            margin: 20px 0 15px;
            font-weight: 400;
        }

        .hero-role .typed-text {
            color: var(--accent);
            font-weight: 600;
            border-right: 2px solid var(--accent);
            padding-right: 4px;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            50% { border-color: transparent; }
        }

        .hero-description {
            color: var(--text-secondary);
            font-size: 1.05rem;
            line-height: 1.8;
            margin-bottom: 35px;
            max-width: 500px;
        }

        .hero-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 32px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            transition: var(--transition);
            cursor: pointer;
            border: none;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--gradient-1);
            color: white;
            box-shadow: 0 4px 20px rgba(108, 99, 255, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(108, 99, 255, 0.5);
        }

        .btn-outline {
            background: transparent;
            color: var(--text-primary);
            border: 2px solid var(--border-color);
        }

        .btn-outline:hover {
            border-color: var(--primary);
            background: rgba(108, 99, 255, 0.05);
            transform: translateY(-2px);
        }

        .hero-stats {
            display: flex;
            gap: 40px;
            margin-top: 50px;
            padding-top: 30px;
            border-top: 1px solid var(--border-color);
        }

        .stat-item h3 {
            font-size: 1.8rem;
            font-weight: 800;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-item p {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Hero Image / Avatar */
        .hero-visual {
            display: flex;
            justify-content: center;
            align-items: center;
            animation: fadeInUp 1s ease-out 0.3s backwards;
        }

        .avatar-container {
            position: relative;
            width: 380px;
            height: 380px;
        }

        .avatar-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: var(--primary);
            border-right-color: var(--accent);
            animation: spin 8s linear infinite;
        }

        .avatar-ring:nth-child(2) {
            inset: 15px;
            border-top-color: var(--accent);
            border-right-color: #E058A0;
            animation-direction: reverse;
            animation-duration: 12s;
        }

        .avatar-inner {
            position: absolute;
            inset: 35px;
            border-radius: 50%;
            background: var(--gradient-1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 6rem;
            font-weight: 900;
            color: white;
            text-shadow: 0 4px 20px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .avatar-inner::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,0.3) 100%);
        }

        .avatar-inner span {
            position: relative;
            z-index: 1;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .floating-badge {
            position: absolute;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 12px 18px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--shadow-card);
            animation: float 6s ease-in-out infinite;
            white-space: nowrap;
        }

        .floating-badge:nth-child(4) {
            top: 20px;
            right: -20px;
            animation-delay: -2s;
        }

        .floating-badge:nth-child(5) {
            bottom: 40px;
            left: -30px;
            animation-delay: -4s;
        }

        .floating-badge:nth-child(6) {
            bottom: -10px;
            right: 10px;
            animation-delay: -1s;
        }

        .floating-badge i {
            color: var(--primary);
            font-size: 1.1rem;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== ABOUT SECTION ===== */
        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: start;
        }

        .about-text p {
            color: var(--text-secondary);
            margin-bottom: 20px;
            font-size: 1.05rem;
            line-height: 1.9;
        }

        .about-text p strong {
            color: var(--text-primary);
        }

        .about-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }

        .info-item {
            background: var(--bg-card);
            padding: 20px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }

        .info-item:hover {
            border-color: var(--primary);
            transform: translateY(-3px);
        }

        .info-item .label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 5px;
        }

        .info-item .value {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.95rem;
        }

        .info-item .value a {
            color: var(--primary-light);
            text-decoration: none;
        }

        .info-item .value a:hover {
            text-decoration: underline;
        }

        .about-highlights {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .highlight-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 25px;
            display: flex;
            gap: 20px;
            align-items: flex-start;
            transition: var(--transition);
        }

        .highlight-card:hover {
            border-color: var(--primary);
            transform: translateX(5px);
            box-shadow: var(--shadow-glow);
        }

        .highlight-icon {
            width: 50px;
            height: 50px;
            min-width: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
        }

        .highlight-card:nth-child(1) .highlight-icon {
            background: rgba(108, 99, 255, 0.15);
            color: var(--primary-light);
        }

        .highlight-card:nth-child(2) .highlight-icon {
            background: rgba(0, 212, 170, 0.15);
            color: var(--accent);
        }

        .highlight-card:nth-child(3) .highlight-icon {
            background: rgba(224, 88, 160, 0.15);
            color: #E058A0;
        }

        .highlight-card:nth-child(4) .highlight-icon {
            background: rgba(0, 180, 216, 0.15);
            color: #00B4D8;
        }

        .highlight-content h4 {
            font-weight: 700;
            margin-bottom: 5px;
            font-size: 1rem;
        }

        .highlight-content p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.6;
        }

        /* ===== SKILLS SECTION ===== */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .skill-category {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 30px;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .skill-category::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            border-radius: 3px 3px 0 0;
        }

        .skill-category:nth-child(1)::before { background: var(--gradient-1); }
        .skill-category:nth-child(2)::before { background: var(--gradient-3); }
        .skill-category:nth-child(3)::before { background: var(--gradient-2); }
        .skill-category:nth-child(4)::before { background: linear-gradient(135deg, #F7971E, #FFD200); }
        .skill-category:nth-child(5)::before { background: linear-gradient(135deg, #00B4D8, #90E0EF); }
        .skill-category:nth-child(6)::before { background: linear-gradient(135deg, #E058A0, #FF6B6B); }

        .skill-category:hover {
            border-color: var(--primary);
            transform: translateY(-5px);
            box-shadow: var(--shadow-glow);
        }

        .skill-category-icon {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            margin-bottom: 15px;
        }

        .skill-category:nth-child(1) .skill-category-icon { background: rgba(108,99,255,0.15); color: var(--primary-light); }
        .skill-category:nth-child(2) .skill-category-icon { background: rgba(0,212,170,0.15); color: var(--accent); }
        .skill-category:nth-child(3) .skill-category-icon { background: rgba(224,88,160,0.15); color: #E058A0; }
        .skill-category:nth-child(4) .skill-category-icon { background: rgba(247,151,30,0.15); color: #F7971E; }
        .skill-category:nth-child(5) .skill-category-icon { background: rgba(0,180,216,0.15); color: #00B4D8; }
        .skill-category:nth-child(6) .skill-category-icon { background: rgba(255,107,107,0.15); color: #FF6B6B; }

        .skill-category h3 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .skill-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .skill-tag {
            background: rgba(108, 99, 255, 0.08);
            border: 1px solid rgba(108, 99, 255, 0.15);
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 0.82rem;
            color: var(--text-secondary);
            font-weight: 500;
            transition: var(--transition);
        }

        .skill-tag:hover {
            background: rgba(108, 99, 255, 0.2);
            color: var(--text-primary);
            border-color: var(--primary);
        }

        /* ===== EXPERIENCE / TIMELINE ===== */
        .timeline {
            position: relative;
            max-width: 800px;
            margin: 0 auto;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--border-color);
            transform: translateX(-50%);
        }

        .timeline-item {
            position: relative;
            width: 50%;
            padding: 0 40px 50px;
        }

        .timeline-item:nth-child(odd) {
            left: 0;
            text-align: right;
        }

        .timeline-item:nth-child(even) {
            left: 50%;
        }

        .timeline-dot {
            position: absolute;
            top: 5px;
            width: 16px;
            height: 16px;
            background: var(--primary);
            border-radius: 50%;
            border: 3px solid var(--bg-dark);
            box-shadow: 0 0 0 3px var(--primary);
        }

        .timeline-item:nth-child(odd) .timeline-dot {
            right: -8px;
        }

        .timeline-item:nth-child(even) .timeline-dot {
            left: -8px;
        }

        .timeline-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 25px;
            transition: var(--transition);
        }

        .timeline-card:hover {
            border-color: var(--primary);
            box-shadow: var(--shadow-glow);
        }

        .timeline-date {
            display: inline-block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--accent);
            background: rgba(0, 212, 170, 0.1);
            padding: 4px 12px;
            border-radius: 50px;
            margin-bottom: 10px;
            font-family: 'JetBrains Mono', monospace;
        }

        .timeline-card h3 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .timeline-card .organization {
            color: var(--primary-light);
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 10px;
        }

        .timeline-card p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.7;
        }

        /* ===== CERTIFICATIONS ===== */
        .cert-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        .cert-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 30px;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .cert-card::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 60px;
            height: 60px;
            background: var(--gradient-1);
            opacity: 0.05;
            border-radius: 0 0 0 60px;
        }

        .cert-card:hover {
            border-color: var(--primary);
            transform: translateY(-5px);
            box-shadow: var(--shadow-glow);
        }

        .cert-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background: rgba(108, 99, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            font-size: 1.3rem;
            color: var(--primary-light);
        }

        .cert-card h3 {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .cert-card .cert-issuer {
            color: var(--accent);
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .cert-card p {
            color: var(--text-secondary);
            font-size: 0.88rem;
            line-height: 1.6;
        }

        /* ===== INTERESTS / LOOKING FOR ===== */
        .interests-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .interest-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 35px 25px;
            text-align: center;
            transition: var(--transition);
        }

        .interest-card:hover {
            border-color: var(--primary);
            transform: translateY(-5px);
            box-shadow: var(--shadow-glow);
        }

        .interest-icon {
            width: 70px;
            height: 70px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 1.8rem;
        }

        .interest-card:nth-child(1) .interest-icon {
            background: rgba(108, 99, 255, 0.12);
            color: var(--primary-light);
        }

        .interest-card:nth-child(2) .interest-icon {
            background: rgba(0, 212, 170, 0.12);
            color: var(--accent);
        }

        .interest-card:nth-child(3) .interest-icon {
            background: rgba(224, 88, 160, 0.12);
            color: #E058A0;
        }

        .interest-card h3 {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .interest-card p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.7;
        }

        /* ===== CONTACT SECTION ===== */
        .contact-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: start;
        }

        .contact-info h3 {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 15px;
            letter-spacing: -0.5px;
        }

        .contact-info > p {
            color: var(--text-secondary);
            font-size: 1.05rem;
            line-height: 1.8;
            margin-bottom: 35px;
        }

        .contact-methods {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .contact-method {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 18px 22px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            transition: var(--transition);
            text-decoration: none;
            color: inherit;
        }

        .contact-method:hover {
            border-color: var(--primary);
            transform: translateX(5px);
        }

        .contact-method-icon {
            width: 48px;
            height: 48px;
            min-width: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .contact-method:nth-child(1) .contact-method-icon { background: rgba(108,99,255,0.15); color: var(--primary-light); }
        .contact-method:nth-child(2) .contact-method-icon { background: rgba(0,119,181,0.15); color: #0077B5; }
        .contact-method:nth-child(3) .contact-method-icon { background: rgba(0,212,170,0.15); color: var(--accent); }

        .contact-method-text .label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .contact-method-text .value {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.95rem;
        }

        .contact-form {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 35px;
        }

        .contact-form h3 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 14px 18px;
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.95rem;
            transition: var(--transition);
            outline: none;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn-submit {
            width: 100%;
            justify-content: center;
            padding: 16px;
            font-size: 1rem;
        }

        /* ===== FOOTER ===== */
        .footer {
            background: var(--bg-card);
            border-top: 1px solid var(--border-color);
            padding: 40px 30px;
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .footer-left p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }
